name: gitleaks

# Varredura de segredos (gitleaks) — roda em push/PR para impedir que
# credenciais entrem no repositório. Usa a config `.gitleaks.toml` do repo.
#
# Nota: o `gitleaks/gitleaks-action@v2` é gratuito em repositórios públicos e
# pessoais; em repositórios de ORGANIZAÇÃO privada exige um `GITLEAKS_LICENSE`
# (secret) — caso contrário, troque por rodar o binário direto (docker run).

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  scan:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
